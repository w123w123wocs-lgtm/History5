<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мандрівка у часі: іграшки</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff0c9,#e3f7ff 55%,#f4e7ff);color:#333}
.game{width:min(920px,100%);background:#fff;border-radius:32px;padding:clamp(18px,4vw,36px);box-shadow:0 14px 38px #59452b25;text-align:center}
h1{font-size:clamp(29px,5vw,46px);color:#e87826;margin:0 0 8px}.intro{font-size:18px;color:#666;margin-bottom:18px}
.score{display:inline-block;background:#fff2b8;border:3px solid #ffdb62;border-radius:22px;padding:10px 20px;font-weight:bold;font-size:20px;margin-bottom:16px}
.progress{height:13px;background:#eee;border-radius:20px;overflow:hidden;max-width:620px;margin:0 auto 18px}.bar{height:100%;width:0;background:linear-gradient(90deg,#72d6a0,#f7c84c);transition:width .4s}
.question{font-size:clamp(23px,4vw,32px);font-weight:bold;margin:12px 0 18px}
.picture-wrap{width:min(440px,100%);height:300px;margin:0 auto 20px;background:linear-gradient(145deg,#f8fbff,#fff8e9);border:4px solid #e7edf5;border-radius:26px;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.toy-picture{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;border-radius:14px}
.toy-name{font-size:21px;font-weight:bold;color:#536276;margin:-8px 0 18px;min-height:25px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:620px;margin:0 auto}
.answer{border:0;border-radius:22px;padding:18px 10px;font-size:clamp(18px,3vw,25px);font-weight:bold;cursor:pointer;box-shadow:0 6px 14px #00000016;transition:transform .15s,filter .15s}
.answer:hover{transform:translateY(-3px);filter:brightness(1.03)}.modern{background:#d9f5e5;color:#176a43}.old{background:#ffe8c8;color:#8b4d12}.answer:disabled{opacity:.7;cursor:default}
.message{min-height:42px;margin:17px 0 0;font-size:23px;font-weight:bold;color:#26965a}
.finish{display:none;padding:25px 5px}.trophy{font-size:82px}.finish h2{font-size:36px;color:#e87826}.finish p{font-size:23px;color:#555}.restart{border:0;border-radius:22px;padding:15px 28px;background:#ff9b45;color:white;font-size:21px;font-weight:bold;cursor:pointer}
.confetti{position:fixed;top:-25px;z-index:10;pointer-events:none;animation:drop 1.7s linear forwards}@keyframes drop{to{transform:translateY(110vh) rotate(650deg);opacity:0}}
@media(max-width:520px){.picture-wrap{height:240px}.answer{padding:15px 6px}.game{border-radius:24px}}
</style>
</head>
<body>
<main class="game">
 <section id="playScreen">
  <h1>🧸 Мандрівка у часі</h1>
  <p class="intro">Роздивись іграшку та визнач, коли вона з'явилася!</p>
  <div class="score">⭐ Правильних відповідей: <span id="score">0</span> із 6</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="question" id="question">Це сучасна чи старовинна іграшка?</div>
  <div class="picture-wrap"><img class="toy-picture" id="toyImage" src="" alt="Зображення іграшки"></div>
  <div class="toy-name" id="toyName"></div>
  <div class="answers">
   <button class="answer modern" id="modernBtn" onclick="answer('modern')">✨ СУЧАСНА</button>
   <button class="answer old" id="oldBtn" onclick="answer('old')">🏺 СТАРОВИННА</button>
  </div>
  <div class="message" id="message" aria-live="polite"></div>
 </section>
 <section class="finish" id="finishScreen">
  <div class="trophy">🏆🎉</div><h2>Мандрівку завершено!</h2>
  <p>Ти правильно визначив(ла) <strong id="finalScore">0</strong> із 6 іграшок!</p>
  <button class="restart" onclick="restartGame()">🔄 Зіграти ще раз</button>
 </section>
</main>
<script>
// Для показу фотографій потрібне підключення до інтернету.
const toys=[
 {name:'Лабубу',type:'modern',src:'https://images.novelship.com/product/pop_mart_labubu_the_monsters_i_found_you_vinyl_dol_0_54176.jpeg?auto=compress&bg=FFFFFF&fit=fill&fm=webp&h=1200&pad=80&q=75&trim=color&w=1200',alt:'Фігурка Лабубу',credit:'https://novelship.com/pop-mart-labubu-the-monsters-i-found-you-vinyl-doll'},
 {name:'Лялька Bratz',type:'modern',src:'https://media.falabella.com/falabellaPE/134010002_01/w%3D800%2Ch%3D800%2Cfit%3Dpad',alt:'Лялька Bratz у коробці',credit:'https://www.falabella.com.pe/falabella-pe/product/134010001/Muneca-Bratz-OPP-Cloe-Basica-25-cm/134010002'},
 {name:'Сучасний набір конструктора',type:'modern',src:'https://www.tradeinn.com/f/13888/138883650_2/lego-main-street-building.webp',alt:'Яскравий набір конструктора з деталями для складання',credit:'https://www.tradeinn.com/kidinn/en/lego-main-street-building/138883650/p'},
 {name:'Українська лялька-мотанка',type:'old',src:'https://i.etsystatic.com/54512232/r/il/d87cd6/6303002359/il_570xN.6303002359_i2j4.jpg',alt:'Традиційна українська лялька-мотанка',credit:'https://www.etsy.com/listing/1776189894/handmade-motanka-doll-bereginya-doll'},
 {name:'Олов’яні солдатики',type:'old',src:'https://d2mpxrrcad19ou.cloudfront.net/item_images/830480/10160419_fullsize.jpg',alt:'Колекція старовинних олов’яних солдатиків',credit:'https://www.bukowskis.com/sv/lots/830480-tennsoldater-ca-42-st-1900-tal'},
 {name:'Дерев’яний коник',type:'old',src:'https://images.auctionet.com/thumbs/large_item_3775963_b53a7adcda.jpg',alt:'Старовинна дерев’яна іграшка-коник на коліщатках',credit:'https://auctionet.com/en/3775963-a-toy-horse-painted-decor-probably-18th-20th-century'}
];
let order=[],index=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Англійська озвучка короткими й зрозумілими фразами.
let englishVoice = null;
let speechBusy = false;

function chooseEnglishVoice() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  englishVoice = voices.find(v => /^en[-_]US$/i.test(v.lang))
    || voices.find(v => /^en([_-]|$)/i.test(v.lang))
    || null;
}

if ('speechSynthesis' in window) {
  chooseEnglishVoice();
  window.speechSynthesis.addEventListener('voiceschanged', chooseEnglishVoice);
}

function speakFeedback(isCorrect) {
  if (!('speechSynthesis' in window) || speechBusy) return;
  chooseEnglishVoice();

  const utterance = new SpeechSynthesisUtterance(isCorrect ? 'Great!' : 'Oh no!');
  utterance.lang = 'en-US';
  if (englishVoice) utterance.voice = englishVoice;
  utterance.rate = 0.9;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;

  speechBusy = true;
  utterance.onend = () => { speechBusy = false; };
  utterance.onerror = () => { speechBusy = false; };
  window.speechSynthesis.speak(utterance);
}

function showToy(){if(index>=order.length){finish();return}locked=false;const toy=order[index];$('toyImage').src=toy.src;$('toyImage').alt=toy.alt;$('toyName').textContent=toy.name;$('message').textContent='';$('score').textContent=score;$('bar').style.width=(index/order.length*100)+'%';$('modernBtn').disabled=false;$('oldBtn').disabled=false}
function answer(choice){if(locked)return;const toy=order[index];if(choice===toy.type){locked=true;score++;$('score').textContent=score;$('message').textContent='Правильно! Чудова відповідь! 🌟';$('modernBtn').disabled=true;$('oldBtn').disabled=true;speakFeedback(true);confetti();setTimeout(()=>{index++;showToy()},1450)}else{$('message').textContent='Спробуй ще раз! Уважно роздивись іграшку. 😊';speakFeedback(false)}}
function confetti(){const icons=['⭐','✨','🎉','💛'];for(let i=0;i<22;i++){const el=document.createElement('span');el.className='confetti';el.textContent=icons[Math.floor(Math.random()*icons.length)];el.style.left=Math.random()*100+'vw';el.style.fontSize=(15+Math.random()*17)+'px';el.style.animationDuration=(1+Math.random())+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}}
function finish(){$('bar').style.width='100%';$('playScreen').style.display='none';$('finishScreen').style.display='block';$('finalScore').textContent=score;speak('Мандрівку завершено! Молодець! Ти правильно визначив іграшки!')}
function restartGame(){index=0;score=0;order=shuffle(toys);$('finishScreen').style.display='none';$('playScreen').style.display='block';showToy()}
order=shuffle(toys);showToy();
</script>
</body>
</html>
